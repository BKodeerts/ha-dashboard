<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<meta name="design_doc_mode" content="canvas">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  body { margin:0; background:#c8c5be; font-family:'Space Grotesk',system-ui,sans-serif; -webkit-font-smoothing:antialiased; }
  a { color:#111318; text-decoration:none; }
  a:hover { color:oklch(0.62 0.13 250); }
</style>
</helmet>

<section style="padding:56px; display:flex; flex-wrap:wrap; gap:56px; align-items:flex-start">

  <div style="display:flex; flex-direction:column; gap:14px">
    <div style="display:flex; align-items:center; gap:10px">
      <span style="font-family:'IBM Plex Mono',monospace; font-size:12px; font-weight:500; background:#111318; color:#f0eeea; padding:4px 9px; border-radius:5px">4a</span>
      <span style="font-size:15px; font-weight:500; color:#111318">Popup op de telefoon — over het dashboard</span>
    </div>

    <div style="width:390px; height:844px; border-radius:44px; overflow:hidden; position:relative; background:#f0eeea; color:#111318; box-shadow:0 30px 70px -20px rgba(17,19,24,0.35)">

      <div style="position:absolute; inset:0; padding:44px 18px 0 20px; display:flex; flex-direction:column; gap:16px">
        <div style="display:flex; align-items:center; gap:10px">
          <svg viewBox="0 0 24 24" style="width:24px; height:24px; display:block; fill:#8a877f"><path d="M6,19A5,5 0 0,1 1,14A5,5 0 0,1 6,9C7,6.65 9.3,5 12,5C15.43,5 18.24,7.66 18.5,11.03L19,11A4,4 0 0,1 23,15A4,4 0 0,1 19,19H6M19,13H17V12A5,5 0 0,0 12,7C9.5,7 7.45,8.82 7.06,11.19C6.73,11.07 6.37,11 6,11A3,3 0 0,0 3,14A3,3 0 0,0 6,17H19A2,2 0 0,0 21,15A2,2 0 0,0 19,13Z"></path></svg>
          <span style="font-size:26px; font-weight:400; letter-spacing:-0.03em">18,0°</span>
          <span style="flex:1"></span>
          <div style="width:30px; height:30px; border-radius:50%; background:rgba(17,19,24,0.08)"></div>
          <div style="width:30px; height:30px; border-radius:50%; background:rgba(17,19,24,0.08)"></div>
        </div>
        <div style="display:grid; grid-template-columns:1fr 1fr; gap:12px">
          <sc-for list="{{ ghostTiles }}" as="t" hint-placeholder-count="6">
            <div style="height:104px; border-radius:20px; background:rgba(17,19,24,0.06); padding:14px; display:flex; flex-direction:column; justify-content:space-between">
              <span style="font-size:15px; font-weight:500; color:rgba(17,19,24,0.5)">{{ t.n }}</span>
              <span style="font-family:'IBM Plex Mono',monospace; font-size:11px; color:rgba(17,19,24,0.3)">{{ t.m }}</span>
            </div>
          </sc-for>
        </div>
      </div>

      <div style="position:absolute; inset:0; background:rgba(10,11,14,0.55); backdrop-filter:blur(3px)"></div>
      <div style="position:absolute; left:0; right:0; bottom:0">
        <dc-import name="Weer Sheet" place="KMI · Halle" hint-size="100%,600px"></dc-import>
      </div>
    </div>
  </div>

  <div style="display:flex; flex-direction:column; gap:14px">
    <div style="display:flex; align-items:center; gap:10px">
      <span style="font-family:'IBM Plex Mono',monospace; font-size:12px; font-weight:500; background:#111318; color:#f0eeea; padding:4px 9px; border-radius:5px">4b</span>
      <span style="font-size:15px; font-weight:500; color:#111318">Dezelfde kaart als dialoog op tablet / desktop</span>
    </div>

    <div style="width:1024px; height:768px; border-radius:20px; overflow:hidden; position:relative; background:#f0eeea; box-shadow:0 30px 70px -20px rgba(17,19,24,0.35)">
      <div style="position:absolute; inset:0; padding:28px; display:grid; grid-template-columns:repeat(4,1fr); grid-auto-rows:120px; gap:16px; align-content:start">
        <sc-for list="{{ ghostCards }}" as="t" hint-placeholder-count="12">
          <div style="border-radius:16px; background:rgba(17,19,24,0.06)"></div>
        </sc-for>
      </div>
      <div style="position:absolute; inset:0; background:rgba(10,11,14,0.5); backdrop-filter:blur(3px)"></div>
      <div style="position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); width:420px; border-radius:28px; overflow:hidden; box-shadow:0 40px 80px -20px rgba(10,11,14,0.6)">
        <dc-import name="Weer Sheet" place="KMI · Halle" hint-size="420px,600px"></dc-import>
      </div>
    </div>
    <div style="font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:0.06em; color:#4a4842; max-width:1024px">browser_mod popup / more-info dialoog — zelfde component, alleen de container verschilt: onderaan op de telefoon, gecentreerd op groot scherm.</div>
  </div>

</section>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{}">
class Component extends DCLogic {
  renderVals() {
    return {
      ghostTiles: [
        { n: 'Woonkamer', m: '21,4° · 48 %' }, { n: 'Keuken', m: '22,0° · 51 %' },
        { n: 'Bureau', m: '23,1° · 45 %' }, { n: 'Slaapkamer', m: '19,8° · 53 %' },
        { n: 'Nora', m: '20,2° · 50 %' }, { n: 'Badkamer', m: '22,6° · 62 %' }
      ],
      ghostCards: Array.from({ length: 12 }, (_, i) => ({ i }))
    };
  }
}

</script>
</body>
</html>
