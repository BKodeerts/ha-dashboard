name: Release

# Tag a version and this builds the panel and attaches it to the GitHub release.
# HACS reads that release asset, so updating the dashboard in Home Assistant is
# one click — no file copying, no YAML change.
#
#   npm version patch && git push --follow-tags
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - run: npm run build:panel

      # HACS downloads this asset by the `filename` in hacs.json.
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/panel/ha-dashboard-panel.js \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
